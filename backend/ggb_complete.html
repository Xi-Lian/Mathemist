<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>高中数学图形库</title>
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            padding: 30px;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 500;
            color: #444;
            margin-bottom: 25px;
        }
        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .mode-btn {
            padding: 10px 30px;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: white;
            color: #666;
        }
        .mode-btn:hover { background: #f5f5f5; }
        .mode-btn.active { background: #666; color: white; border-color: #666; }
        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #fafafa;
            border-radius: 4px;
            border-left: 3px solid #999;
            border-top: 1px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
        }
        .section-title {
            font-size: 17px;
            font-weight: 500;
            color: #555;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: white;
            color: #666;
        }
        .btn:hover { background: #f5f5f5; }
        .btn-clear {
            padding: 10px 40px;
            font-size: 15px;
            border-color: #666;
            background: #666;
            color: white;
        }
        .btn-clear:hover { background: #555; border-color: #555; }
        .clear-container {
            display: flex;
            justify-content: center;
            margin: 25px 0;
        }
        #ggb {
            width: 100%;
            height: 800px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-top: 15px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>高中数学图形库</h1>

        <div class="mode-switch">
            <button class="mode-btn active" onclick="switchMode('2d')" id="btn-2d">2D 模式</button>
            <button class="mode-btn" onclick="switchMode('3d')" id="btn-3d">3D 模式</button>
        </div>

        <div id="content-2d">
            <div class="section">
                <div class="section-title">平面图形</div>
                <div class="btn-group">
                    <button class="btn" onclick="loadEquilateralTriangle()">等边三角形</button>
                    <button class="btn" onclick="loadIsoscelesTriangle()">等腰三角形</button>
                    <button class="btn" onclick="loadRightTriangle()">直角三角形</button>
                    <button class="btn" onclick="loadSquare()">正方形</button>
                    <button class="btn" onclick="loadRectangle()">长方形</button>
                    <button class="btn" onclick="loadParallelogram()">平行四边形</button>
                    <button class="btn" onclick="loadRhombus()">菱形</button>
                    <button class="btn" onclick="loadTrapezoid()">梯形</button>
                    <button class="btn" onclick="loadCircle()">圆形</button>
                    <button class="btn" onclick="loadEllipse()">椭圆</button>
                    <button class="btn" onclick="loadPentagon()">正五边形</button>
                    <button class="btn" onclick="loadHexagon()">正六边形</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">函数图像</div>
                <div class="btn-group">
                    <button class="btn" onclick="loadLinear()">一次函数: y = x</button>
                    <button class="btn" onclick="loadLinear2()">一次函数: y = 2x + 1</button>
                    <button class="btn" onclick="loadQuadratic()">二次函数: y = x²</button>
                    <button class="btn" onclick="loadQuadratic2()">二次函数: y = -x² + 2x + 3</button>
                    <button class="btn" onclick="loadCubic()">三次函数: y = x³</button>
                    <button class="btn" onclick="loadInverse()">反比例函数: y = 1/x</button>
                    <button class="btn" onclick="loadExponential()">指数函数: y = 2^x</button>
                    <button class="btn" onclick="loadLogarithm()">对数函数: y = ln(x)</button>
                    <button class="btn" onclick="loadSine()">正弦函数: y = sin(x)</button>
                    <button class="btn" onclick="loadCosine()">余弦函数: y = cos(x)</button>
                    <button class="btn" onclick="loadTangent()">正切函数: y = tan(x)</button>
                </div>
            </div>
        </div>

        <div id="content-3d" class="hidden">
            <div class="section">
                <div class="section-title">立体图形</div>
                <div class="btn-group">
                    <button class="btn" onclick="loadSphere()">球体</button>
                    <button class="btn" onclick="loadCube()">正方体</button>
                    <button class="btn" onclick="loadCuboid()">长方体</button>
                    <button class="btn" onclick="loadCylinder()">圆柱</button>
                    <button class="btn" onclick="loadCone()">圆锥</button>
                    <button class="btn" onclick="loadTetrahedron()">四面体</button>
                    <button class="btn" onclick="loadTriangularPrism()">三棱柱</button>
                    <button class="btn" onclick="loadSquarePyramid()">四棱锥</button>
                    <button class="btn" onclick="loadOctahedron()">正八面体</button>
                </div>
            </div>
        </div>

        <div class="clear-container">
            <button class="btn btn-clear" onclick="clearAll()">清空画布</button>
        </div>

        <div id="ggb"></div>
    </div>

    <script>
        var currentMode = '2d';
        var applet = null;
        var api = null;

        function getParameters(mode) {
            return {
                "appName": mode === '2d' ? 'classic' : '3d',
                "width": 1600,
                "height": 800,
                "showToolBar": true,
                "showAlgebraInput": true,
                "showMenuBar": true,
                "language": "zh-CN"
            };
        }

        function initApplet(mode) {
            var ggbDiv = document.getElementById('ggb');
            ggbDiv.innerHTML = '';
            applet = new GGBApplet(getParameters(mode), true);
            applet.inject('ggb');
            api = null;
            setTimeout(function() { api = applet.getAppletObject(); }, 2000);
        }

        function switchMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            document.getElementById('btn-2d').classList.toggle('active', mode === '2d');
            document.getElementById('btn-3d').classList.toggle('active', mode === '3d');
            document.getElementById('content-2d').classList.toggle('hidden', mode !== '2d');
            document.getElementById('content-3d').classList.toggle('hidden', mode !== '3d');
            initApplet(mode);
        }

        function clearAll() {
            if (api) {
                var objects = api.getAllObjectNames();
                for (var i = 0; i < objects.length; i++) {
                    api.deleteObject(objects[i]);
                }
            }
        }

        window.addEventListener('load', function() { initApplet('2d'); });

        function loadEquilateralTriangle() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0)');
                api.evalCommand('B=(2,0)');
                api.evalCommand('C=(1,1.732)');
                api.evalCommand('Polygon(A,B,C)');
            }, 300);
        }

        function loadIsoscelesTriangle() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0)');
                api.evalCommand('B=(3,0)');
                api.evalCommand('C=(1.5,2)');
                api.evalCommand('Polygon(A,B,C)');
            }, 300);
        }

        function loadRightTriangle() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0)');
                api.evalCommand('B=(3,0)');
                api.evalCommand('C=(0,2)');
                api.evalCommand('Polygon(A,B,C)');
            }, 300);
        }

        function loadSquare() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0)');
                api.evalCommand('B=(2,0)');
                api.evalCommand('C=(2,2)');
                api.evalCommand('D=(0,2)');
                api.evalCommand('Polygon(A,B,C,D)');
            }, 300);
        }

        function loadRectangle() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0)');
                api.evalCommand('B=(3,0)');
                api.evalCommand('C=(3,2)');
                api.evalCommand('D=(0,2)');
                api.evalCommand('Polygon(A,B,C,D)');
            }, 300);
        }

        function loadParallelogram() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0)');
                api.evalCommand('B=(3,0)');
                api.evalCommand('C=(4,2)');
                api.evalCommand('D=(1,2)');
                api.evalCommand('Polygon(A,B,C,D)');
            }, 300);
        }

        function loadRhombus() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(1,0)');
                api.evalCommand('B=(3,1.732)');
                api.evalCommand('C=(1,3.464)');
                api.evalCommand('D=(-1,1.732)');
                api.evalCommand('Polygon(A,B,C,D)');
            }, 300);
        }

        function loadTrapezoid() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0)');
                api.evalCommand('B=(4,0)');
                api.evalCommand('C=(3,2)');
                api.evalCommand('D=(1,2)');
                api.evalCommand('Polygon(A,B,C,D)');
            }, 300);
        }

        function loadCircle() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('O=(0,0)');
                api.evalCommand('Circle(O,2)');
            }, 300);
        }

        function loadEllipse() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('F1=(-2,0)');
                api.evalCommand('F2=(2,0)');
                api.evalCommand('P=(0,1.5)');
                api.evalCommand('Ellipse(F1, F2, P)');
            }, 300);
        }

        function loadPentagon() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(2,0)');
                api.evalCommand('B=(0.618,1.902)');
                api.evalCommand('C=(-1.618,1.176)');
                api.evalCommand('D=(-1.618,-1.176)');
                api.evalCommand('E=(0.618,-1.902)');
                api.evalCommand('Polygon(A,B,C,D,E)');
            }, 300);
        }

        function loadHexagon() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(2,0)');
                api.evalCommand('B=(1,1.732)');
                api.evalCommand('C=(-1,1.732)');
                api.evalCommand('D=(-2,0)');
                api.evalCommand('E=(-1,-1.732)');
                api.evalCommand('F=(1,-1.732)');
                api.evalCommand('Polygon(A,B,C,D,E,F)');
            }, 300);
        }

        function loadLinear() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = x'); }, 300);
        }

        function loadLinear2() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = 2x + 1'); }, 300);
        }

        function loadQuadratic() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = x^2'); }, 300);
        }

        function loadQuadratic2() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = -x^2 + 2x + 3'); }, 300);
        }

        function loadCubic() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = x^3'); }, 300);
        }

        function loadInverse() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = 1/x'); }, 300);
        }

        function loadExponential() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = 2^x'); }, 300);
        }

        function loadLogarithm() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = ln(x)'); }, 300);
        }

        function loadSine() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = sin(x)'); }, 300);
        }

        function loadCosine() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = cos(x)'); }, 300);
        }

        function loadTangent() {
            if (!api) return; clearAll();
            setTimeout(function() { api.evalCommand('f(x) = tan(x)'); }, 300);
        }

        function loadSphere() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('O=(0,0,0)');
                api.evalCommand('Sphere(O,2)');
            }, 300);
        }

        function loadCube() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0,0)');
                api.evalCommand('B=(2,0,0)');
                api.evalCommand('C=(2,2,0)');
                api.evalCommand('D=(0,2,0)');
                api.evalCommand('E=(0,0,2)');
                api.evalCommand('F=(2,0,2)');
                api.evalCommand('G=(2,2,2)');
                api.evalCommand('H=(0,2,2)');
                api.evalCommand('Polygon(A,B,C,D)');
                api.evalCommand('Polygon(E,F,G,H)');
                api.evalCommand('Polygon(A,B,F,E)');
                api.evalCommand('Polygon(B,C,G,F)');
                api.evalCommand('Polygon(C,D,H,G)');
                api.evalCommand('Polygon(D,A,E,H)');
            }, 300);
        }

        function loadCuboid() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0,0)');
                api.evalCommand('B=(3,0,0)');
                api.evalCommand('C=(3,2,0)');
                api.evalCommand('D=(0,2,0)');
                api.evalCommand('E=(0,0,1.5)');
                api.evalCommand('F=(3,0,1.5)');
                api.evalCommand('G=(3,2,1.5)');
                api.evalCommand('H=(0,2,1.5)');
                api.evalCommand('Polygon(A,B,C,D)');
                api.evalCommand('Polygon(E,F,G,H)');
                api.evalCommand('Polygon(A,B,F,E)');
                api.evalCommand('Polygon(B,C,G,F)');
                api.evalCommand('Polygon(C,D,H,G)');
                api.evalCommand('Polygon(D,A,E,H)');
            }, 300);
        }

        function loadCylinder() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('O1=(0,0,0)');
                api.evalCommand('O2=(0,0,3)');
                api.evalCommand('Cylinder(O1, O2, 1.5)');
            }, 300);
        }

        function loadCone() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('O=(0,0,0)');
                api.evalCommand('P=(0,0,3)');
                api.evalCommand('Cone(O, P, 1.5)');
            }, 300);
        }

        function loadTetrahedron() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0,0)');
                api.evalCommand('B=(2,0,0)');
                api.evalCommand('C=(1,1.732,0)');
                api.evalCommand('D=(1,0.577,1.633)');
                api.evalCommand('Polygon(A,B,C)');
                api.evalCommand('Polygon(A,B,D)');
                api.evalCommand('Polygon(B,C,D)');
                api.evalCommand('Polygon(C,A,D)');
            }, 300);
        }

        function loadTriangularPrism() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0,0)');
                api.evalCommand('B=(2,0,0)');
                api.evalCommand('C=(1,1.732,0)');
                api.evalCommand('A1=(0,0,2)');
                api.evalCommand('B1=(2,0,2)');
                api.evalCommand('C1=(1,1.732,2)');
                api.evalCommand('Polygon(A,B,C)');
                api.evalCommand('Polygon(A1,B1,C1)');
                api.evalCommand('Polygon(A,B,B1,A1)');
                api.evalCommand('Polygon(B,C,C1,B1)');
                api.evalCommand('Polygon(C,A,A1,C1)');
            }, 300);
        }

        function loadSquarePyramid() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(0,0,0)');
                api.evalCommand('B=(2,0,0)');
                api.evalCommand('C=(2,2,0)');
                api.evalCommand('D=(0,2,0)');
                api.evalCommand('P=(1,1,2.5)');
                api.evalCommand('Polygon(A,B,C,D)');
                api.evalCommand('Polygon(A,B,P)');
                api.evalCommand('Polygon(B,C,P)');
                api.evalCommand('Polygon(C,D,P)');
                api.evalCommand('Polygon(D,A,P)');
            }, 300);
        }

        function loadOctahedron() {
            if (!api) return; clearAll();
            setTimeout(function() {
                api.evalCommand('A=(1.414,0,0)');
                api.evalCommand('B=(-1.414,0,0)');
                api.evalCommand('C=(0,1.414,0)');
                api.evalCommand('D=(0,-1.414,0)');
                api.evalCommand('E=(0,0,1.414)');
                api.evalCommand('F=(0,0,-1.414)');
                api.evalCommand('Polygon(A,C,E)');
                api.evalCommand('Polygon(C,B,E)');
                api.evalCommand('Polygon(B,D,E)');
                api.evalCommand('Polygon(D,A,E)');
                api.evalCommand('Polygon(A,C,F)');
                api.evalCommand('Polygon(C,B,F)');
                api.evalCommand('Polygon(B,D,F)');
                api.evalCommand('Polygon(D,A,F)');
            }, 300);
        }
    </script>
</body>
</html>
