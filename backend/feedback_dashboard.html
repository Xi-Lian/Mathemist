<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户反馈系统 - 管理员仪表盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .status-bar {
            background: white;
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-dot.error {
            background: #ef4444;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1f2937;
        }
        
        .stat-label {
            color: #6b7280;
            font-size: 1rem;
            margin-top: 5px;
        }
        
        .stat-card.like {
            border-top: 4px solid #10b981;
        }
        
        .stat-card.dislike {
            border-top: 4px solid #ef4444;
        }
        
        .stat-card.rate {
            border-top: 4px solid #667eea;
        }
        
        .stat-card.total {
            border-top: 4px solid #f59e0b;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            font-weight: 600;
        }
        
        .content-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .content-card h2 {
            color: #1f2937;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .list {
            list-style: none;
        }
        
        .list-item {
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .list-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }
        
        .item-title {
            font-weight: 600;
            color: #1f2937;
            font-size: 1.1rem;
        }
        
        .item-badge {
            background: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .item-badge.like {
            background: #10b981;
        }
        
        .item-meta {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        
        .item-query {
            background: #f3f4f6;
            padding: 10px 15px;
            border-radius: 8px;
            color: #374151;
            font-style: italic;
            margin-top: 10px;
        }
        
        .suggestion-text {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            color: #0369a1;
            margin: 10px 0;
            line-height: 1.6;
        }
        
        .contact-info {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .timestamp {
            color: #9ca3af;
            font-size: 0.85rem;
        }
        
        .type-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .type-stat {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .type-name {
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }
        
        .type-numbers {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .type-like {
            color: #10b981;
        }
        
        .type-dislike {
            color: #ef4444;
        }
        
        .hidden {
            display: none !important;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 用户反馈系统</h1>
            <p>管理员仪表盘 - 查看和分析用户反馈数据</p>
        </div>
        
        <div class="status-bar">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">检查连接...</span>
            </div>
            <button class="refresh-btn" id="refreshBtn" onclick="loadAllData()">
                🔄 刷新数据
            </button>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card like">
                <div class="stat-icon">👍</div>
                <div class="stat-value" id="totalLikes">0</div>
                <div class="stat-label">总点赞</div>
            </div>
            <div class="stat-card dislike">
                <div class="stat-icon">👎</div>
                <div class="stat-value" id="totalDislikes">0</div>
                <div class="stat-label">总点踩</div>
            </div>
            <div class="stat-card total">
                <div class="stat-icon">📝</div>
                <div class="stat-value" id="totalFeedback">0</div>
                <div class="stat-label">总反馈</div>
            </div>
            <div class="stat-card rate">
                <div class="stat-icon">✨</div>
                <div class="stat-value" id="likeRate">0%</div>
                <div class="stat-label">点赞率</div>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('disliked')">👎 被点踩资源</button>
            <button class="tab" onclick="showTab('suggestions')">💡 改进建议</button>
            <button class="tab" onclick="showTab('types')">📊 资源类型统计</button>
        </div>
        
        <div id="dislikedTab" class="content-card">
            <h2>👎 被点踩最多的资源</h2>
            <div id="dislikedList"></div>
        </div>
        
        <div id="suggestionsTab" class="content-card hidden">
            <h2>💡 用户改进建议</h2>
            <div id="suggestionsList"></div>
        </div>
        
        <div id="typesTab" class="content-card hidden">
            <h2>📊 各资源类型反馈统计</h2>
            <div id="typeStats"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        let currentTab = 'disliked';
        
        async function checkConnection() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    statusDot.classList.remove('error');
                    statusText.textContent = '后端服务运行正常';
                    return true;
                }
            } catch (e) {
                console.error('Connection error:', e);
            }
            
            statusDot.classList.add('error');
            statusText.textContent = '无法连接到后端服务';
            return false;
        }
        
        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE}/feedback/statistics`);
                const data = await response.json();
                
                if (data.success) {
                    const stats = data.statistics;
                    const total = stats.total_likes + stats.total_dislikes;
                    const likeRate = total > 0 ? (stats.total_likes / total * 100).toFixed(1) : 0;
                    
                    document.getElementById('totalLikes').textContent = stats.total_likes;
                    document.getElementById('totalDislikes').textContent = stats.total_dislikes;
                    document.getElementById('totalFeedback').textContent = total;
                    document.getElementById('likeRate').textContent = likeRate + '%';
                    
                    renderTypeStats(stats.feedback_by_type || {});
                }
            } catch (e) {
                console.error('Load statistics error:', e);
            }
        }
        
        async function loadDisliked() {
            const container = document.getElementById('dislikedList');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/feedback/disliked?limit=50`);
                const data = await response.json();
                
                if (data.success) {
                    const resources = data.resources;
                    
                    if (resources.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">🎉</div>
                                <h3>暂无被点踩的资源！</h3>
                                <p>继续保持，等待用户反馈...</p>
                            </div>
                        `;
                        return;
                    }
                    
                    container.innerHTML = `
                        <ul class="list">
                            ${resources.map((res, index) => `
                                <li class="list-item">
                                    <div class="item-header">
                                        <div class="item-title">${index + 1}. ${res.resource_id}</div>
                                        <span class="item-badge">👎 ${res.dislike_count}次</span>
                                    </div>
                                    ${res.feedbacks && res.feedbacks.length > 0 ? `
                                        <div class="item-meta">
                                            <strong>最新反馈:</strong> ${res.feedbacks[res.feedbacks.length - 1].dislike_reason || 'N/A'}
                                        </div>
                                        <div class="item-query">
                                            用户查询: "${res.feedbacks[res.feedbacks.length - 1].query || 'N/A'}"
                                        </div>
                                    ` : ''}
                                </li>
                            `).join('')}
                        </ul>
                    `;
                }
            } catch (e) {
                container.innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
                console.error('Load disliked error:', e);
            }
        }
        
        async function loadSuggestions() {
            const container = document.getElementById('suggestionsList');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/feedback/suggestions?limit=100`);
                const data = await response.json();
                
                if (data.success) {
                    const suggestions = data.suggestions;
                    
                    if (suggestions.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">📝</div>
                                <h3>暂无改进建议</h3>
                                <p>等待用户提出建议...</p>
                            </div>
                        `;
                        return;
                    }
                    
                    container.innerHTML = `
                        <ul class="list">
                            ${suggestions.slice().reverse().map((sug, index) => `
                                <li class="list-item">
                                    <div class="item-header">
                                        <div class="item-title">建议 #${suggestions.length - index}</div>
                                        <span class="timestamp">${new Date(sug.timestamp).toLocaleString('zh-CN')}</span>
                                    </div>
                                    ${sug.query ? `<div class="item-query">用户查询: "${sug.query}"</div>` : ''}
                                    <div class="suggestion-text">${sug.suggestion}</div>
                                    ${sug.contact ? `<div class="contact-info">📧 联系方式: ${sug.contact}</div>` : ''}
                                </li>
                            `).join('')}
                        </ul>
                    `;
                }
            } catch (e) {
                container.innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
                console.error('Load suggestions error:', e);
            }
        }
        
        function renderTypeStats(feedbackByType) {
            const container = document.getElementById('typeStats');
            const types = Object.keys(feedbackByType);
            
            if (types.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <p>暂无类型统计数据</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="type-stats">
                    ${types.map(type => `
                        <div class="type-stat">
                            <div class="type-name">${type}</div>
                            <div class="type-numbers">
                                <span class="type-like">👍 ${feedbackByType[type].likes}</span>
                                <span class="type-dislike">👎 ${feedbackByType[type].dislikes}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        function showTab(tabName) {
            currentTab = tabName;
            
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('dislikedTab').classList.add('hidden');
            document.getElementById('suggestionsTab').classList.add('hidden');
            document.getElementById('typesTab').classList.add('hidden');
            
            document.getElementById(tabName + 'Tab').classList.remove('hidden');
            
            if (tabName === 'disliked') loadDisliked();
            if (tabName === 'suggestions') loadSuggestions();
        }
        
        async function loadAllData() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '刷新中...';
            
            const connected = await checkConnection();
            
            if (connected) {
                await loadStatistics();
                await loadDisliked();
                if (currentTab === 'suggestions') await loadSuggestions();
            }
            
            btn.disabled = false;
            btn.textContent = '🔄 刷新数据';
        }
        
        window.onload = function() {
            loadAllData();
            setInterval(checkConnection, 5000);
        };
    </script>
</body>
</html>
